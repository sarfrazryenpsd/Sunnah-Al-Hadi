syntax = "proto3";

option java_package = "com.ryen.sunnah_alhadi.datastore";
option java_multiple_files = true;

message ProtoUserPreferences {
  string username = 1;
  int32 theme_mode = 2;
  bool is_dynamic_theme_enabled = 3;
  bool has_completed_onboarding = 4;
  repeated string recently_viewed_sunnah_ids = 5;
  string current_sotd_id = 6;
  int64 sotd_generated_date = 7;
  bool is_sotd_seen = 8;
  int32 sotd_notification_time = 9;  // 0=MORNING, 1=EVENING, 2=NIGHT
  bool is_sotd_notification_enabled = 10;
}
